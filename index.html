<style>
:root{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mu:#9aa4b2;--ac:#e8590c;--ok:#2b8a3e;--bd:#2a323d}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:19px}h1 span{color:var(--ac)}
.sub{color:var(--mu);font-size:12px;margin-top:2px}
main{max-width:980px;margin:auto;padding:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px;font-weight:600}
select,input,button{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.alt{background:#222a35;color:var(--tx);border:1px solid var(--bd);font-weight:500}
button.alt.active{border-color:var(--ac);background:var(--ac);color:#fff}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:6px}
.chips button{width:auto;white-space:nowrap;padding:7px 12px;font-size:12.5px;border-radius:20px}
.cams{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:420px;overflow-y:auto}
.cam{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.cam.playing{border-color:var(--ac);background:rgba(232,89,12,0.14)}
.cam b{display:block;font-size:14px}
.cam small{color:var(--mu);font-size:12px;display:block;margin-top:2px}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;background:var(--ok);color:#fff;margin-right:4px}
.badge.hls{background:#1971c2}
.cam button{width:auto;padding:8px 14px;flex-shrink:0}
.player-wrap{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px;display:none}
.player-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.player video,.player img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.live-overlay{position:absolute;top:10px;left:10px;background:rgba(220,38,38,0.9);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:4px;z-index:3;pointer-events:none;display:flex;align-items:center;gap:6px}
.hud-time{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.75);color:#0f0;font:12px monospace;padding:4px 8px;border-radius:4px;z-index:3;pointer-events:none}
.dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
.buf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px;background:rgba(0,0,0,.78);z-index:2;pointer-events:none;text-align:center;padding:16px}
.spin{width:34px;height:34px;border:4px solid #fff4;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--mu);margin-top:8px}
/* --- anti-copy (deterrent) --- */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img,video{-webkit-user-drag:none}
</style>

<script>
(function(){
  function isField(t){ return t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA'); }

  // Disable right-click
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // Disable selecting, copying, cutting, dragging (except inside input boxes)
  ['selectstart','copy','cut','dragstart'].forEach(function(ev){
    document.addEventListener(ev, function(e){ if(!isField(e.target)) e.preventDefault(); });
  });

  // Disable common shortcuts: F12, Ctrl/Cmd+U, S, P, Shift+I/J/C/K
  document.addEventListener('keydown', function(e){
    var k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
    if(e.keyCode===123 || k==='f12'){ e.preventDefault(); return; }
    if(c && (k==='u' || k==='s' || k==='p')){ e.preventDefault(); return; }
    if(c && e.shiftKey && (k==='i' || k==='j' || k==='c' || k==='k')){ e.preventDefault(); return; }
    if(e.metaKey && e.altKey && (k==='i' || k==='u' || k==='j' || k==='c')){ e.preventDefault(); return; }
  });
})();
</script>

  function playNativeHlsVideo(hlsUrl, title, onFail) {
    var tok = playToken;

      if (!alive()) return;
      gaveUp = true;
      if (startWatch) { clearTimeout(startWatch); startWatch = null; }
      if (onFail) onFail(); else failCurrent(msg || 'Video feed blocked or offline');
    }

      if (startWatch) clearTimeout(startWatch);

        if (!alive()) return;

      if (!alive()) return;
      nativeTried = true;
      if (hlsInstance) { try { hlsInstance.destroy(); } catch(e){} hlsInstance = null; }
      showBuf('Trying built-in video player...');
      v.onerror = function(){ giveUp('Video blocked or offline'); };
      v.src = hlsUrl;
      v.load();
      v.play().catch(function(){});
      watch(9000);
    }

    v.addEventListener('waiting', function(){ if (alive()) showBuf('Buffering...'); });
    v.addEventListener('playing', function(){
      if (tok !== playToken) return;
      clearBuf();
      if (startWatch) { clearTimeout(startWatch); startWatch = null; }
      skipCount = 0;
      document.getElementById('plStatus').textContent = 'Playing live video inside the page' + (nativeTried ? ' (built-in player)' : '');
    });

      if (!alive()) return;

          lowLatencyMode: false,
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          backBufferLength: 20,
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 10,
          capLevelToPlayerSize: true,
          startLevel: -1,
          abrEwmaDefaultEstimate: 1500000,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 4,
          fragLoadingRetryDelay: 1000
        });

        inst.on(Hls.Events.MANIFEST_PARSED, function(){ v.play().catch(function(){}); });
        inst.on(Hls.Events.ERROR, function(e, d){
          if (!alive() || !d.fatal) return;
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR && netTry++ < 1) { showBuf('Reconnecting...'); inst.startLoad(); }
          else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && medTry++ < 2) { inst.recoverMediaError(); }

        });

      }

  }

  function playLiveImageStream(imgUrl, title, intervalMs) {
    stopAll();
    var tok = playToken, got = false, fails = 0;
    document.getElementById('plStatus').textContent = 'Live camera picture - refreshes automatically';
    var img = document.createElement('img');
    pl.appendChild(img);
    addHudOverlays('OFFICIAL LIVE CCTV');
    showBuf('Loading camera picture...');

    function updateFrame() {
      var sep = imgUrl.indexOf('?') === -1 ? '?' : '&';
      var preload = new Image();
      preload.onload = function(){
        if (tok !== playToken) return;
        got = true; skipCount = 0;
        img.src = preload.src;
        clearBuf();
      };
      preload.onerror = function(){
        if (tok !== playToken || got) return;
        if (++fails >= 2) { stopAll(); failCurrent('Camera picture unavailable'); }
      };
      preload.src = imgUrl + sep + 't=' + Date.now();
    }
    updateFrame();
    refreshTimer = setInterval(updateFrame, intervalMs || 2500);
    if (fails === 0) setTimeout(function(){ if (tok === playToken && !got) { fails = 99; stopAll(); failCurrent('Camera picture did not load'); } }, 15000);
  }

  function playYtDirectFrameStream(vid, title) {
    stopAll();
    var tok = playToken, got = false;
    document.getElementById('plStatus').textContent = 'YouTube cameras show refreshing still frames when this file is opened from phone storage. Host the file on a web address for full video.';
    var img = document.createElement('img');
    pl.appendChild(img);
    addHudOverlays('LIVE CAMERA FEED');
    showBuf('Loading camera picture...');

    function updateYtFrame() {
      var preload = new Image();
      preload.onload = function(){
        if (tok !== playToken) return;
        got = true; skipCount = 0;
        img.src = preload.src;
        clearBuf();
      };
      preload.onerror = function(){
        if (tok !== playToken) return;
        var alt = new Image();
        alt.onload = function(){ if (tok !== playToken) return; got = true; skipCount = 0; img.src = alt.src; clearBuf(); };
        alt.onerror = function(){ if (tok === playToken && !got) { stopAll(); failCurrent('No picture from this camera'); } };
        alt.src = 'https://i.ytimg.com/vi/' + vid + '/hqdefault_live.jpg?t=' + Date.now();
      };
      preload.src = 'https://i.ytimg.com/vi_webp/' + vid + '/maxresdefault_live.webp?t=' + Date.now();
    }
    updateYtFrame();
    refreshTimer = setInterval(updateYtFrame, 3000);
  }

  document.getElementById('qBtn').onclick = function(){
    var u = document.getElementById('qUrl').value.trim();
    if (!u) return;
    var m = u.match(/(?:youtu\.be\/|v=|\/live\/|\/embed\/)([\w-]{11})/);
    if (m) startZeroIframePlayer({name: 'Custom Live Camera', vid: m[1], type: 'ytlive'});
    else if (/\.m3u8/i.test(u)) startZeroIframePlayer({name: 'Custom HLS Stream', url: u, type: 'hls'});
    else startZeroIframePlayer({name: 'Custom CCTV Feed', url: u, type: 'mjpeg'});
  };

  if (!/^https?:$/.test(location.protocol)) {
    var tip = document.createElement('div');
    tip.className = 'note';
    tip.style.cssText = 'margin-top:8px;color:#ffa94d';
    tip.textContent = 'Opened from phone storage: traffic and satellite cameras work here. YouTube cameras can only show still frames. Host this file on a web address (GitHub Pages / Netlify Drop) for full-speed YouTube video.';
    document.getElementById('plWrap').insertBefore(tip, document.getElementById('pl'));
  }

  // Load Featured Direct Cams on startup
  loadLocation('Featured', 'Featured');
})();
</script>
</body>
</html>
